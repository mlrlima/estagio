<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
 	xmlns:h="http://xmlns.jcp.org/jsf/html"
 	xmlns:f="http://xmlns.jcp.org/jsf/core"
 	xmlns:p="http://primefaces.org/ui"
 	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
 	template="WEB-INF/template/Layout.xhtml">
 	
 	<!-- :h == tag do jsf -->
 	
	<ui:define name="titulo">Cadastro dos Pets</ui:define>

	<ui:define name="conteudo">
	
		<f:metadata>
			<f:viewAction action="#{gestaoPetsBean.todosPets}"/>
		</f:metadata>
		
		<h:form id="frm">
		
			<p:commandButton value="Gerenciar Usuários"
          					 icon="pi pi-users"
                 			 action="GestaoUsuarios?faces-redirect=true" />
			
			<p:messages id="messages" showDetail="true" />
			
			<p:toolbar id="toolbar">
				<f:facet name="left">
					
					<p:inputText id="termoPesquisa"
								 placeholder="Pesquisar"
								 value="#{gestaoPetsBean.termoPesquisa}" />
					<p:commandButton icon="pi pi-search"
									 actionListener="#{gestaoPetsBean.pesquisar}"
									 update="petsDataTable messages"
									 process="@this termoPesquisa" />
					
				</f:facet>
				<f:facet name="right">
					
					<p:commandButton value="Novo"
									 icon="pi pi-plus"
									 actionListener="#{gestaoPetsBean.prepararNovoPet}"
									 oncomplete="PF('petDialogWidgetVar').show()"
									 update="petDialog"
									 process="@this" >
						<p:resetInput target="petDialog" />
					</p:commandButton>
					
					<p:separator />
					
					<p:commandButton value="Editar"
									 icon="pi pi-pencil"
									 disabled="#{not gestaoPetsBean.petSelecionado}"
									 oncomplete="PF('petDialogWidgetVar').show()"
									 update="petDialog"
									 process="@this" >
									 
						<p:resetInput target="petDialog"/>
					</p:commandButton>
					
					<p:separator />
					
					<p:commandButton value="Excluir"
									 icon="pi pi-minus"
									 disabled="#{not gestaoPetsBean.petSelecionado}"
									 actionListener="#{gestaoPetsBean.excluir}"
									 update="messages petsDataTable toolbar"
									 process="@this" >
					
						<!-- nao ta funcionando
						<p:confirm header="Confirmação de exclusão"
								   icon="pi pi-exclamation-triangle"/>
									 
								-->
					</p:commandButton>
					
				</f:facet>
			</p:toolbar>
			
			<p:spacer height="20px"></p:spacer>
			
			<p:dataTable id="petsDataTable"
						 value="#{gestaoPetsBean.listaPets}"
						 var="pet"
						 emptyMessage="Nenhuma informação encontrada."
						 
						 selectionMode="single"
						 selection="#{gestaoPetsBean.pet}"
						 rowKey="#{pet.id}" >
						 
				<p:ajax event="rowSelect"
						update="frm:toolbar" />
				<p:ajax event="rowUnselect"
						update="frm:toolbar" />
						 
				<p:column headerText="Nome"
						  sortBy="#{pet.nome}">
					<h:outputText value="#{pet.nome}"/>
				</p:column>
				
				<p:column headerText="Especie"
						  sortBy="#{pet.especie}" >
					<h:outputText value="#{pet.especie}" />
				</p:column>
				
				<p:column headerText="Dono(user)"
						  sortBy="#{pet.dono.email}">
					<h:outputText value="#{pet.dono.email}"/>
				</p:column>
				
			</p:dataTable>
		
			<p:dialog id="petDialog"
					  header="Novo pet"
					  widgetVar="petDialogWidgetVar"
					  modal="true" >
				
				<p:defaultCommand target="salvarCommandButton"
								  scope="petDialog" />
								  
				<h:panelGrid id="petPanelGrid"
							 columns="2"
							 rendered="#{gestaoPetsBean.pet ne null}" >
					
					<p:outputLabel value="Nome: "
								   for="nome" />
					<h:panelGroup>
						<p:inputText id="nome"
									 maxlength="100"
									 required="true"
									 value="#{gestaoPetsBean.pet.nome}" />
						<p:message for="nome" />
					</h:panelGroup>
					
					<p:outputLabel value="Especie: "
								   for="especie" />
					<h:panelGroup>
						<p:selectOneMenu id="especie"
										 value="#{gestaoPetsBean.pet.especie}"
										 required="true" >
							<f:selectItem itemLabel="Selecione: " itemValue="#{null}" noSelectionOption="true" />
							<f:selectItems value="#{gestaoPetsBean.especies}"
										   var="especie"
										   itemValue="#{especie}" />
						</p:selectOneMenu>
						
						<p:message for="especie" />
					</h:panelGroup>
					
					
					<p:outputLabel value="Dono: "
								   for="dono" />
					<h:panelGroup>
						<p:selectOneMenu id="dono"
										 value="#{gestaoPetsBean.usuarioId}"
										 required="true" >
							<f:selectItem itemLabel="Selecione: " itemValue="#{null}" noSelectionOption="true" />
							<f:selectItems value="#{gestaoPetsBean.todosUsuarios}"
										   var="dono"
										   itemValue="#{dono.id}"
										   itemLabel="#{dono.email}" />
						</p:selectOneMenu>
						
						<p:message for="dono" />
					</h:panelGroup>
					
					<p:outputLabel />
					<p:commandButton id="salvarCommandButton"
									 value="Salvar"
									 actionListener="#{gestaoPetsBean.salvar}"
									 update="petDialog"
									 oncomplete="if(!args.validationFailed) PF('petDialogWidgetVar').hide()"
									 process="petDialog" />
							 
				</h:panelGrid>
					  
			</p:dialog>
		
			<p:commandButton value="Logout"
				                 action="#{loginBean.logout}"
				                 icon="pi pi-sign-out" />
		
		</h:form>
		
	</ui:define>
</ui:composition>
