<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
 	xmlns:h="http://xmlns.jcp.org/jsf/html"
 	xmlns:f="http://xmlns.jcp.org/jsf/core">
 	
 	<!-- :h == tag do jsf -->
 	
	<h:head>
	
		<meta charset="UTF-8"/>
		<title>Gestão dos Pets</title>
		 
		<h:outputStylesheet library="atividades_estagio" name="estilo.css" />
	 	
	</h:head>

	<h:body>
	
		<header>Gestão dos Pets</header>
		
		
		<div id="conteudo">
		
			<h:form>
				<h:commandLink value="Gestao dos Usuarios" action="GestaoUsuarios?faces-redirect=true"/>
			</h:form>
		
			<h:form>
				<h:panelGrid columns="2">
					<h:outputLabel value="Nome: " for="nome" />
					<h:inputText id="nome" value="#{gestaoPetsBean.pet.nome}" />
			
					<h:outputLabel value="Especie: " for="especie" />
					<h:selectOneMenu id="especie" value="#{gestaoPetsBean.pet.especie}">
						<f:selectItem itemLabel="Selecione:" />
						<f:selectItems value="#{gestaoPetsBean.especies}"/>
					</h:selectOneMenu>
					
					<h:outputLabel value="Data nascimento: " for="dataNascimento" />
					<h:inputText id="dataNascimento" value="#{gestaoPetsBean.pet.dataNascimento}">
						<f:convertDateTime pattern="dd/mm/yyyy" />
					</h:inputText>
					
					<h:outputLabel/>
					<h:commandButton value="Salvar" actionListener="#{gestaoPetsBean.salvar}"/>
				
				</h:panelGrid>
				
				<h:dataTable value="#{[0,0,0,0]}">
					<h:column>
						<f:facet name="header">
							<h:outputText value="Nome"/>
						</f:facet>
						
						<h:outputText value="teste"/>
					</h:column>
					
					<h:column>
						<f:facet name="header">
							<h:outputText value="Email"/>
						</f:facet>
						
						<h:outputText value="teste2"/>
					</h:column>
					
					<h:column>
						<f:facet name="header">
							<h:outputText value="Role"/>
						</f:facet>
						
						<h:outputText value="ADMIN"/>
					</h:column>
					
				</h:dataTable>
				
			</h:form>
			
		</div>
		
		<footer>
			Referência: <a href="URL">https://www.youtube.com/watch?v=ezwgBvsd6Ps</a>
		</footer>
	</h:body>

</html>
