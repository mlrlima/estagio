<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
 	xmlns:h="http://xmlns.jcp.org/jsf/html"
 	xmlns:f="http://xmlns.jcp.org/jsf/core"
 	xmlns:p="http://primefaces.org/ui"
 	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
 	template="WEB-INF/template/Layout.xhtml">
 	
 	<!-- :h == tag do jsf -->


	<ui:define name="titulo">Cadastro dos Usuarios</ui:define>

	<ui:define name="conteudo">
	
		<f:metadata>
	 		<f:viewAction action="#{gestaoUsuariosBean.todosUsuarios}" />
	 	</f:metadata>
		
		
		<h:form id="frm">
		
			<p:defaultCommand target="pesquisarCommandButton" />
		
			<p:commandButton value="Gerenciar Pets"
                 			 action="GestaoPets?faces-redirect=true"
                 			 process="@this"
                 			 immediate="true" />
		
			<p:messages id="messages" showDetail="true" />
		
			<p:toolbar id="toolbar">
				<f:facet name="left">
			
					<p:inputText id="termoPesquisa"
								 placeholder="Pesquisar"
						 		 value="#{gestaoUsuariosBean.termoPesquisa}"/>
						 		 
					<p:commandButton icon="pi pi-search"
									 actionListener="#{gestaoUsuariosBean.pesquisar}"
									 update="usuariosDataTable messages"
									 process="@this termoPesquisa"
									 id="pesquisarCommandButton" />
					
				</f:facet>
				<f:facet name="right">
				
					<p:commandButton value="Novo"
									 icon="pi pi-user-plus" 
									 actionListener="#{gestaoUsuariosBean.prepararNovoUsuario}"
									 oncomplete="PF('usuarioDialogWidgetVar').show()"
									 update="usuarioDialog"
									 process="@this"> <!-- so vai processar esse botao, nao os outros -->
						
						<p:resetInput target="usuarioDialog"/>
					</p:commandButton>
					
					<p:separator />
					
					<p:commandButton value="Editar"
									 icon="pi pi-user-edit"
									 disabled="#{not gestaoUsuariosBean.usuarioSelecionado}"
									 actionListener="#{gestaoUsuariosBean.prepararEdicao}"
									 oncomplete="PF('usuarioDialogWidgetVar').show()"
									 update="usuarioDialog"
									 process="@this" >
									 
						<p:resetInput target="usuarioDialog"/>
					</p:commandButton>
					
					<p:separator />
					
					<p:commandButton value="Excluir"
									 icon="pi pi-user-minus"
									 disabled="#{not gestaoUsuariosBean.usuarioSelecionado}"
									 actionListener="#{gestaoUsuariosBean.excluir}"
									 update="messages usuariosDataTable toolbar"
									 process="@this" >
					
						<!-- nao ta funcionando
						<p:confirm header="Confirmação de exclusão"
								   icon="pi pi-exclamation-triangle"/>
									 
								-->
					</p:commandButton>
				
				 </f:facet>
			
			</p:toolbar>
			
			<p:spacer height="20px"></p:spacer>
		
		
			<p:dataTable id="usuariosDataTable"
						 value="#{gestaoUsuariosBean.listaUsuarios}"
						 var="usuario"
						 emptyMessage="Nenhuma informação encontrada."
				
						 selectionMode="single"
						 selection="#{gestaoUsuariosBean.usuario}"
						 rowKey="#{usuario.id}">
						 
				<p:ajax event="rowSelect"
						update="frm:toolbar" />
				<p:ajax event="rowUnselect"
						update="frm:toolbar" />
				
				<p:column headerText="Nome"
						  sortBy="#{usuario.nome}">
					<h:outputText value="#{usuario.nome}" />
				</p:column>
				
				<p:column headerText="Email"
						  sortBy="#{usuario.email}">
					<h:outputText value="#{usuario.email}" />
				</p:column>
				
				<p:column headerText="Senha" >
					<h:outputText value="#{usuario.senha}" />
				</p:column>
				
				<p:column headerText="Role"
						  sortBy="#{usuario.role}">
					<h:outputText value="#{usuario.role}" />
				</p:column>
				
			</p:dataTable>
			
			<!-- novo usuario -->
			<p:dialog id="usuarioDialog"
					  header="Novo usuario"
					  widgetVar="usuarioDialogWidgetVar"
					  modal="true">
			
				<p:defaultCommand target="salvarCommandButton"
								  scope="usuarioDialog"/>
								  
				<p:messages id="messagesPanelGrid" showDetail="true" />
			
				<h:panelGrid id="usuarioPanelGrid"
							 columns="2"
							 rendered="#{gestaoUsuariosBean.usuario ne null}">
				
					<p:outputLabel value="Nome: "
								   for="nome" />
					<h:panelGroup>
						<p:inputText id="nome"
									 maxlength="100"
									 required="true" 
									 value="#{gestaoUsuariosBean.usuario.nome}"/>
						<!-- mensagem de erro -->
						<p:message for="nome"/>
					</h:panelGroup>
					
					<p:outputLabel value="Email: "
								   for="email" />
					<h:panelGroup>
						<p:inputText id="email"
									 maxlength="50"
									 required="true"
									 value="#{gestaoUsuariosBean.usuario.email}"/>
						<!-- mensagem de erro -->
						<p:message for="email"/>
					</h:panelGroup>
					
					<p:outputLabel value="Senha: "
								   for="senha" />
					<h:panelGroup>
						<p:password id="senha"
		 							value="#{gestaoUsuariosBean.usuario.senha}"
		 							toggleMask="true"
		 							maxlength="50"
									required="true"/>
						<!-- mensagem de erro -->
						<p:message for="senha"/>
					</h:panelGroup>
					
					<p:outputLabel value="Role: "
								   for="role" />
					<h:panelGroup>
						<p:selectOneMenu id="role"
										 value="#{gestaoUsuariosBean.usuario.role}">
							<f:selectItem itemLabel="Selecione:" />
							<f:selectItems value="#{gestaoUsuariosBean.roles}"
										   var="role"
										   itemValue="#{role}"/>
						</p:selectOneMenu>
						
						<!-- mensagem de erro -->
						<p:message for="role"/>
					</h:panelGroup>
					
					<!-- <p:calendar pattern="dd/MM/yyyy" /> -->
					
					<p:outputLabel/>
					<p:commandButton id="salvarCommandButton"
									 value="Salvar"
									 actionListener="#{gestaoUsuariosBean.salvar}"
									 update="usuarioPanelGrid"
									 oncomplete="if(!args.validationFailed) PF('usuarioDialogWidgetVar').hide()"
									 process="usuarioDialog" />
					
				</h:panelGrid>
			
			</p:dialog>
			
			<p:commandButton value="Logout"
				                 action="#{loginBean.logout}"
				                 icon="pi pi-sign-out" />
			
		</h:form>
		
	</ui:define>

</ui:composition>
