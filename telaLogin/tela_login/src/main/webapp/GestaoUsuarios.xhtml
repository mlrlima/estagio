<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
 	xmlns:h="http://xmlns.jcp.org/jsf/html"
 	xmlns:f="http://xmlns.jcp.org/jsf/core"
 	xmlns:p="http://primefaces.org/ui"
 	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
 	template="WEB-INF/template/Layout.xhtml">
 	
 	<!-- :h == tag do jsf -->


	<ui:define name="titulo">Cadastro dos Usuarios</ui:define>

	<ui:define name="conteudo">
	
		<f:metadata>
	 		<f:viewAction action="#{gestaoUsuariosBean.todosUsuarios}" />
	 	</f:metadata>
		
		
		<h:form>
			<p:toolbar>
				<f:facet name="left">
			
					<p:inputText id="termoPesquisa" placeholder="Pesquisar"  size="20"
						value="#{gestaoUsuariosBean.termoPesquisa}"/>
					<p:commandButton icon="pi pi-search"
						actionListener="#{gestaoUsuariosBean.pesquisar}" update="usuariosDataTable"
						process="@this termoPesquisa" />
					
					<p:separator />
				
					<p:commandButton value="Novo" icon="pi pi-user-plus" 
						actionListener="#{gestaoUsuariosBean.prepararNovoUsuario}"
						oncomplete="PF('usuarioDialogWidgetVar').show()" update="usuarioDialog"
						process="@this"/> <!-- so vai processar esse botao, nao os outros -->
					
					<p:separator />
					
					<p:commandButton value="Editar" icon="pi pi-user-edit" />
					
					<p:separator />
					
					<p:commandButton value="Delear" icon="pi pi-user-minus" />
				
				 </f:facet>
			
			</p:toolbar>
			
			<p:spacer height="20px"></p:spacer>
		
		
			<p:dataTable id="usuariosDataTable" value="#{gestaoUsuariosBean.listaUsuarios}"
				var="usuario" emptyMessage="Nenhuma informação encontrada.">
				
				<p:column headerText="Nome" sortBy="#{usuario.nome}">
					<h:outputText value="#{usuario.nome}" />
				</p:column>
				
				<p:column headerText="Email" sortBy="#{usuario.email}">
					<h:outputText value="#{usuario.email}" />
				</p:column>
				
				<p:column headerText="Senha" >
					<h:outputText value="#{usuario.senha}" />
				</p:column>
				
				<p:column headerText="Role" sortBy="#{usuario.role}">
					<h:outputText value="#{usuario.role}" />
				</p:column>
				
			</p:dataTable>
			
			<!-- novo usuario -->
			<p:dialog id="usuarioDialog" header="Novo usuario" widgetVar="usuarioDialogWidgetVar" modal="true">
			
				<h:panelGrid id="usuarioPanelGrid" columns="2"
					rendered="#{gestaoUsuariosBean.usuario ne null}">
				
					<p:outputLabel value="Nome: " for="nome" />
					<h:panelGroup>
						<p:inputText id="nome" maxlength="100" required="true" 
							value="#{gestaoUsuariosBean.usuario.nome}"/>
						<!-- mensagem de erro -->
						<p:message for="nome"/>
					</h:panelGroup>
					
					<p:outputLabel value="Email: " for="email" />
					<h:panelGroup>
						<p:inputText id="email" maxlength="50" required="true"
							value="#{gestaoUsuariosBean.usuario.email}"/>
						<!-- mensagem de erro -->
						<p:message for="email"/>
					</h:panelGroup>
					
					<p:outputLabel value="Senha: " for="senha" />
					<h:panelGroup>
						<p:inputText id="senha" maxlength="50" required="true"
							value="#{gestaoUsuariosBean.usuario.senha}" />
						<!-- mensagem de erro -->
						<p:message for="senha"/>
					</h:panelGroup>
					
					<p:outputLabel value="Role: " for="role" />
					<p:selectOneMenu id="role" value="#{gestaoUsuariosBean.usuario.role}">
						<f:selectItem itemLabel="Selecione:" />
						<f:selectItems value="#{gestaoUsuariosBean.roles}"
							var="role" itemValue="#{role}"/>
					</p:selectOneMenu>
					
					<!-- <p:calendar pattern="dd/MM/yyyy" /> -->
					
					<p:outputLabel/>
					<p:commandButton value="Salvar" actionListener="#{gestaoUsuariosBean.salvar}"
						update="usuariosDataTable usuarioPanelGrid"
						oncomplete="PF('usuarioDialogWidgetVar').hide()" process="usuarioDialog" />
					
				</h:panelGrid>
			
			</p:dialog>
			
		</h:form>
		
	</ui:define>

</ui:composition>
