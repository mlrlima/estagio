<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
 	xmlns:h="http://xmlns.jcp.org/jsf/html"
 	xmlns:f="http://xmlns.jcp.org/jsf/core">
 	
 	<!-- :h == tag do jsf -->
 	
	<h:head>
	
		<meta charset="UTF-8"/>
		<title>Gestão dos Usuarios</title>
		 
		<h:outputStylesheet library="atividades_estagio" name="estilo.css" />
	 	
	</h:head>

	<h:body>
	
		<header>Gestão dos Usuários</header>
		
		
		<div id="conteudo">
		
			<h:form>
				<h:panelGrid columns="2">
					<h:outputLabel value="Nome: " for="nome" />
					<h:inputText id="nome" />
					
					<h:outputLabel value="Email: " for="email" />
					<h:inputText id="email" />
					
					<h:outputLabel value="Senha: " for="senha" />
					<h:inputText id="senha" />
					
					<h:outputLabel value="Role: " for="role" />
					<h:selectOneMenu id="role">
						<f:selectItem itemLabel="Selecione:" />
						<f:selectItem itemLabel="ADMIN" itemValue="ADMIN" />
						<f:selectItem itemLabel="USER" itemValue="USER" />
					</h:selectOneMenu>
					
					<h:outputLabel/>
					<h:commandButton value="Salvar"/>
				
				</h:panelGrid>
				
				<h:dataTable value="#{[0,0,0,0]}">
					<h:column>
						<f:facet name="header">
							<h:outputText value="Nome"/>
						</f:facet>
						
						<h:outputText value="teste"/>
					</h:column>
					
					<h:column>
						<f:facet name="header">
							<h:outputText value="Email"/>
						</f:facet>
						
						<h:outputText value="teste2"/>
					</h:column>
					
					<h:column>
						<f:facet name="header">
							<h:outputText value="Role"/>
						</f:facet>
						
						<h:outputText value="ADMIN"/>
					</h:column>
					
				</h:dataTable>
				
			</h:form>
			
		</div>
		
		<footer>
			Referência: <a href="URL">https://www.youtube.com/watch?v=ezwgBvsd6Ps</a>
		</footer>
	</h:body>

</html>
