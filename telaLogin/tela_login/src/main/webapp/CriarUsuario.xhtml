                                            <!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
 	xmlns:h="http://xmlns.jcp.org/jsf/html"
 	xmlns:f="http://xmlns.jcp.org/jsf/core"
 	xmlns:p="http://primefaces.org/ui"
 	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
 	template="WEB-INF/template/Layout.xhtml" >
	
	<ui:define name="titulo">Criar novo usuário</ui:define>
	 	
	 	<ui:define name="conteudo">
	 	
	 	<f:metadata>
	 		<f:viewAction action="#{loginBean.telaLogin}" />
		    <f:viewAction action="#{criarUsuarioBean.prepararNovoUsuario}" />
		</f:metadata>
	 	
	 		<h:form>
	 			<p:defaultCommand target="salvarCommandButton" />
	 		
				<p:commandButton value="Login"
				                 action="Login?faces-redirect=true"
				                 process="@this"
                 				 immediate="true" >
			
				<p:resetInput target="usuarioPanelGrid"/>                 
				</p:commandButton>	
			
	 			<p:messages id="messages" />
	 			
	 			
	 			<h:panelGrid id="usuarioPanelGrid"
	 						 columns="2"
							 rendered="#{criarUsuarioBean.usuario ne null}">
				
					<p:outputLabel value="Nome: "
								   for="nome" />
					<h:panelGroup>
						<p:inputText id="nome"
									 maxlength="100"
									 required="true" 
									 value="#{criarUsuarioBean.usuario.nome}"/>
						<!-- mensagem de erro -->
						<p:message for="nome"/>
					</h:panelGroup>
					
					<p:outputLabel value="Email: "
								   for="email" />
					<h:panelGroup>
						<p:inputText id="email"
									 maxlength="50"
									 required="true"
									 value="#{criarUsuarioBean.usuario.email}"/>
						<!-- mensagem de erro -->
						<p:message for="email"/>
					</h:panelGroup>
					
					<p:outputLabel value="Senha: "
								   for="senha" />
					<h:panelGroup>
						<p:password id="senha"
		 							value="#{criarUsuarioBean.usuario.senha}"
		 							toggleMask="true"
		 							maxlength="50"
									required="true"/>
						<!-- mensagem de erro -->
						<p:message for="senha"/>
					</h:panelGroup>
					
					<p:outputLabel value="Role: "
								   for="role" />
					<h:panelGroup>
						<p:selectOneMenu id="role"
										 value="#{criarUsuarioBean.usuario.role}">
							<f:selectItem itemLabel="Selecione:" />
							<f:selectItems value="#{criarUsuarioBean.roles}"
										   var="role"
										   itemValue="#{role}"/>
						</p:selectOneMenu>
						
						<!-- mensagem de erro -->
						<p:message for="role"/>
					</h:panelGroup>
					
					
					<p:outputLabel/>
					<p:commandButton value="Salvar"
									 actionListener="#{criarUsuarioBean.salvar}"
									 update="messages"
									 id="salvarCommandButton" >
			
						<p:resetInput target="@form"/>
					</p:commandButton>	       
					
				</h:panelGrid>

	 		</h:form>
	 	</ui:define>
</ui:composition>
