<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
 	xmlns:h="http://xmlns.jcp.org/jsf/html"
 	xmlns:f="http://xmlns.jcp.org/jsf/core"
 	xmlns:p="http://primefaces.org/ui"
 	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
 	template="WEB-INF/template/Layout.xhtml">
 	
 	<ui:define name="titulo">Login</ui:define>
 	
 	<ui:define name="conteudo">
 	
 		<h:form>
			<p:commandButton value="Novo usuario"
			                 action="CriarUsuario?faces-redirect=true"
			                 icon="pi pi-user-plus"
			                 process="@this"
                 			 immediate="true" >
			
			<p:resetInput target="loginPanelGrid"/>                 
			</p:commandButton>	
		
 			<p:messages id="messages" />
 			
 			<p:panelGrid id="loginPanelGrid" 
 						 columns="2">
 				<p:outputLabel value="Email: "
 							   for="emailInput" />
 				<p:inputText id="emailInput"
 							 placeholder="Informe o email"
 							 value="#{loginBean.emailInput}" />
 							 
 				<p:outputLabel value="Senha: "
 							   for="senhaInput" />
 				<p:password id="senhaInput"
 							placeholder="Informe a senha"
 							value="#{loginBean.senhaInput}"
 							toggleMask="true"
 							redisplay="true"/>
 							
 				<p:outputLabel/>
 				<p:commandButton action="#{loginBean.login}"
 								 update="messages" 
 								 value="Entrar" >
			
					<p:resetInput target="@form"/>                 
				</p:commandButton>
 				
 			
 			</p:panelGrid>
 			
 		</h:form>
 	
 	</ui:define>

</ui:composition>
