<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
 	xmlns:h="http://xmlns.jcp.org/jsf/html"
 	xmlns:f="http://xmlns.jcp.org/jsf/core">
 	
 	<!-- :h == tag do jsf -->
 	
	<h:head>
	
		<meta charset="UTF-8"/>
		<title>Gestão dos Usuarios</title>
		 
		<h:outputStylesheet library="atividades_estagio" name="estilo.css" />
	 	
	</h:head>

	<h:body>
	
		<header>Gestão dos Usuários</header>
		
		
		<div id="conteudo">
		
			<h:form>
				<h:panelGrid columns="2">
					<h:outputLabel value="Numero: " />
					<h:outputText value="#{gestaoUsuariosBean.numero}" />
					
					<h:outputLabel/>
					<h:commandButton value="Salvar"/>
				</h:panelGrid>
				
			</h:form>
			
		</div>
		
		<footer>
			Referência: <a href="URL">https://www.youtube.com/watch?v=ezwgBvsd6Ps</a>
		</footer>
	</h:body>

</html>
